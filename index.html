.hero .in{display:flex;flex-direction:column;justify-content:flex-end;min-height:420px;padding-bottom:30px}
#lang{position:absolute;top:14px;right:16px;z-index:5;font:700 15px "Fira Sans",sans-serif;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(16,12,10,.6);color:var(--ink);cursor:pointer}
.kicker{font-weight:600;margin:0 0 10px;color:var(--sun);letter-spacing:.18em;text-transform:uppercase;font-size:.9rem}
h1{font-size:clamp(4.2rem,26vw,9rem);font-weight:800;line-height:.86;color:var(--ink)}
.sub{margin:14px 0 18px;max-width:34ch}
h1 span{display:block;background:linear-gradient(90deg,#ee7a35,#f5a93a);-webkit-background-clip:text;background-clip:text;color:transparent}
.btns{display:flex;flex-wrap:wrap;gap:10px;grid-column:1/-1}
.btn{display:inline-block;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid var(--herotext);color:var(--herotext)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2a1a12}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.open{grid-column:1/-1;margin:14px 0 0;font-weight:600}
section{padding:30px 0 6px}
h2{font-size:2.5rem;line-height:1;color:var(--ink)}
h2::after{content:"";display:block;width:52px;height:5px;background:var(--sun);border-radius:3px;margin:6px 0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px}
.tabs button{flex:none;font:700 18px "Fira Sans Extra Condensed",sans-serif;text-transform:uppercase;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:linear-gradient(90deg,#ee7a35,#f5a93a);border-color:transparent;color:#100c0a}
#items{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 16px}
.item{display:flex;align-items:baseline;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:0}
.item .n{font-weight:600}
.item small{display:block;color:var(--muted);font-weight:400}
.item .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.item .p{text-align:right;font-weight:800;font-size:1.25rem;font-family:"Fira Sans Extra Condensed",sans-serif;color:var(--flame);white-space:nowrap}
.item.note{color:var(--muted);font-size:.95rem}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
.empty p{margin:0 0 14px}
